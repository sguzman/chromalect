name: Publish Chromalect
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "ontology/**"
      - "ONTOLOGY.md"
      - "tools/glyph-pipeline/**"
      - "data/semantic/**"
      - "data/phonetics/**"
      - "data/progress/**"
      - "data/research/**"
      - "docs/roadmap.md"
      - "data/catalog/colored-strokes-v0.1.json"
      - "palettes/mandarin-component-identity-v0.4.json"
      - "palettes/mandarin-component-identity-v0.5.json"
      - "palettes/mandarin-component-identity-v0.6.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      statuses: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      # One-time prerequisite: Settings > Pages > Build and deployment > Source: GitHub Actions.
      # Do not set enablement: true here: the default GITHUB_TOKEN cannot create a Pages site.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fail early on JavaScript and research CLI syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in site/*.js tools/glyph-pipeline/*.mjs; do
            node --check "$file"
          done
      - name: Resolve Rust dependencies
        run: cargo generate-lockfile --manifest-path tools/glyph-pipeline/Cargo.toml
      - name: Validate component-colored glyph data
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- check
      - name: Test renderer and source-reconciliation invariants
        run: cargo test --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml
      - name: Download pinned stroke geometry and ownership data
        shell: bash
        run: |
          set -euo pipefail
          REV=bddc96d41bef78427ed0e034e9f7e31d71fd1b92
          curl --fail --show-error --silent --location --retry 3 \
            "https://raw.githubusercontent.com/skishore/makemeahanzi/$REV/dictionary.txt" \
            --output "$RUNNER_TEMP/chromalect-dictionary.txt"
          curl --fail --show-error --silent --location --retry 3 \
            "https://raw.githubusercontent.com/skishore/makemeahanzi/$REV/graphics.txt" \
            --output "$RUNNER_TEMP/chromalect-graphics.txt"
      - name: Generate source-backed glyphs and extend atlas
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- discover "$RUNNER_TEMP/chromalect-dictionary.txt" "$RUNNER_TEMP/chromalect-graphics.txt"
      - name: Validate independently grouped Chinese recovery parser
        run: python3 tools/glyph-pipeline/hanzivg_recovery.py --self-test
      - name: Reconcile remaining glyphs with pinned Chinese HanziVG groups
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/glyph-pipeline/hanzivg_recovery.py \
            --coverage site/glyphs/coverage.json \
            --catalog data/catalog/characters-0001-1000.json \
            --palette palettes/mandarin-component-identity-v0.6.json \
            --graphics "$RUNNER_TEMP/chromalect-graphics.txt" \
            --out "$RUNNER_TEMP/hanzivg-candidates.json"
          python3 tools/glyph-pipeline/animcjk_recovery.py --self-test
          REV_ANIM=3e1253b341cc7be14c3540bb3c045e6163557777
          curl --fail --show-error --silent --location --retry 3 \
            "https://raw.githubusercontent.com/parsimonhi/animCJK/$REV_ANIM/dictionaryZhHans.txt" \
            --output "$RUNNER_TEMP/chromalect-animcjk-zhhans.txt"
          python3 tools/glyph-pipeline/animcjk_recovery.py \
            --dictionary "$RUNNER_TEMP/chromalect-animcjk-zhhans.txt" \
            --coverage site/glyphs/coverage.json \
            --catalog data/catalog/characters-0001-1000.json \
            --palette palettes/mandarin-component-identity-v0.6.json \
            --graphics "$RUNNER_TEMP/chromalect-graphics.txt" \
            --candidates "$RUNNER_TEMP/hanzivg-candidates.json"
          # The initial pass replaces tracked atlas character spans. Rebuild from
          # pristine source templates so integration is applied exactly once.
          git restore --worktree -- site/characters
          python3 tools/glyph-pipeline/activate_catalog_cuts.py --self-test
          python3 tools/glyph-pipeline/activate_catalog_cuts.py \
            --candidates "$RUNNER_TEMP/hanzivg-candidates.json" \
            --catalog data/catalog/characters-0001-1000.json \
            --palette palettes/mandarin-component-identity-v0.6.json \
            --summary site/glyphs/active-catalog-cuts.json
          cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- discover \
            "$RUNNER_TEMP/chromalect-dictionary.txt" \
            "$RUNNER_TEMP/chromalect-graphics.txt" \
            "$RUNNER_TEMP/hanzivg-candidates.json"
          test -s site/glyphs/hanzivg-transfers.json
          # The post-build audit must agree across catalog, marker colors,
          # all character SVGs and the generated semantic Mandarin profile.
          cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- check
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path("site/glyphs/active-catalog-cuts.json").read_text())
          assert 10<=summary["count"]<=60
          catalog=json.loads(Path("data/catalog/characters-0001-1000.json").read_text())
          rows={v["character"]:v for v in catalog["characters"]}
          assert all(rows[x["character"]].get(
              "source_selected_catalog_alternative" if x["selection_method"]=="documented_alternative"
              else "source_selected_catalog_cut")==x["active_cut"] for x in summary["selected"])
          print(f"Confirmed {summary['count']} evidence-backed cuts with synchronized Direct/Marker/catalog identities")
          PY
      - name: Enforce first-1000 Mandarin coverage and provenance regression gates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("site/glyphs")
          coverage = json.loads((base / "coverage.json").read_text())
          transfers = json.loads((base / "hanzivg-transfers.json").read_text())
          mapping = json.loads((base / "mappings.json").read_text())
          count = coverage["source_aligned_catalog_glyphs"]
          assert coverage["catalog_size"] == 1000
          assert count + coverage["unmapped_count"] == 1000
          assert count == 1000, f"Mandarin first-tranche glyphs incomplete: {count}/1000"
          assert transfers["count"] >= 55, "Verified secondary Chinese mappings disappeared"
          assert mapping["glyph_count"] >= 1007
          accepted = [row for row in mapping["glyphs"]
                      if row["assignment_status"] == "hanzivg_group_alignment_candidate"]
          assert len(accepted) == transfers["count"]
          assert set(transfers["characters"]) == {row["character"] for row in accepted}
          print(f"Coverage gate: {count}/1000 Mandarin mappings, {coverage['unmapped_count']} unresolved")
          PY
      - name: Publish non-certifying glyph visual-review worklist
        run: |
          node --check tools/glyph-pipeline/glyph_independent_review_worklist.mjs
          node tools/glyph-pipeline/glyph_independent_review_worklist_smoke.mjs
          node tools/glyph-pipeline/glyph_independent_review_worklist.mjs --write
          node tools/glyph-pipeline/glyph_independent_review_worklist.mjs --check
          node --check site/glyph-review-worklist.js
          node tools/glyph-pipeline/glyph_review_worklist_viewer_smoke.mjs
          node --check site/glyph-review-intake.js
          node tools/glyph-pipeline/glyph_review_intake_viewer_smoke.mjs
          test -s site/glyph-review-intake.html
          test -s site/glyph-review-worklist.html
          test -s site/glyphs/review/independent-review-worklist-v0.1.json
      - name: Publish measured Mandarin glyph coverage as a commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          coverage = Path("site/glyphs/coverage.json")
          transfers = Path("site/glyphs/hanzivg-transfers.json")
          if os.environ["PIPELINE_STATUS"] == "success" and coverage.exists() and transfers.exists():
              report = json.loads(coverage.read_text())
              secondary = json.loads(transfers.read_text())
              count = report["source_aligned_catalog_glyphs"]
              remaining = report["unmapped_count"]
              added = secondary["count"]
              state = "success"
              description = f"{count}/1000 mapped, {remaining} unresolved, +{added} source candidates"
          else:
              state = "failure"
              description = "Mandarin glyph recovery pipeline failed before measured completion"
          payload = json.dumps({
              "state": state,
              "context": "chromalect/mandarin-coverage",
              "target_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "description": description
          }).encode()
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          request = urllib.request.Request(url, data=payload, method="POST", headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json"
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              assert response.status == 201
          PY
      - name: Include machine-readable component palette
        run: |
          mkdir -p site/palettes
          cp palettes/mandarin-component-identity-v0.4.json site/palettes/
          cp palettes/mandarin-component-identity-v0.5.json site/palettes/
          cp palettes/mandarin-component-identity-v0.6.json site/palettes/
      - name: Publish ontology vocabulary, schemas and specimens
        run: |
          mkdir -p site/ontology
          cp ontology/*.json site/ontology/
          test -s site/ontology/ontology-v1.json
          test -s site/ontology/specimens-v1.json
          test -s site/ontology/vocabulary.schema.json
          test -s site/ontology/instances.schema.json
