name: Publish Chromalect
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/glyph-pipeline/**"
      - "data/catalog/colored-strokes-v0.1.json"
      - "palettes/mandarin-component-identity-v0.4.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      # One-time prerequisite: Settings > Pages > Build and deployment > Source: GitHub Actions.
      # Do not set enablement: true here: the default GITHUB_TOKEN cannot create a Pages site.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Rust dependencies
        run: cargo generate-lockfile --manifest-path tools/glyph-pipeline/Cargo.toml
      - name: Validate component-colored glyph data
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- check
      - name: Build component-colored SVG atlas
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- build
      - name: Upload static Pages content
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
