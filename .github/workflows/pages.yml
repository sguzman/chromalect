        run: test -s site/glyphs/review/index.html && test -s site/glyphs/review/report.json && test -s site/glyphs/review/flagged.html
      - name: Check generated diagnostic coverage
        run: test -s site/glyphs/diagnostics.json && test -s site/glyphs/diagnostics.html
      - name: Check appearance controls across generated pages
        shell: bash
        run: |
          set -euo pipefail
          test -s site/theme.js
          while IFS= read -r -d '' file; do
            grep -Fq 'theme.js' "$file" || { echo "Missing appearance controls: $file"; exit 1; }
          done < <(find site/glyphs -type f -name '*.html' -print0)
      - name: Audit site-wide navigation on authored and generated pages
        run: |
          node --check site/theme.js
          node --check site/navigation.js
          node --check site/semantic-grammar.js
          node --check site/semantic-lab.js
          node tools/glyph-pipeline/navigation_smoke.mjs
          node tools/glyph-pipeline/shared_layers_smoke.mjs
          node tools/glyph-pipeline/semantic_grammar_smoke.mjs
          node tools/glyph-pipeline/semantic_smoke.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re

          site = Path("site")
          nav = (site / "navigation.js").read_text(encoding="utf-8")
          theme = (site / "theme.js").read_text(encoding="utf-8")
          assert 'new URL("navigation.js", source.src)' in theme
          assert "chromalect-global-nav" in nav
          targets = re.findall(r'\bpath:\s*"([^"]+)"', nav)
          assert len(targets) >= 20, "Important global navigation destinations missing"
          missing = [target for target in targets if not target.startswith("https://")
                     and not (site / target).is_file()]
          assert not missing, f"Broken navigation destinations: {missing}"
          html = list(site.rglob("*.html"))
          assert len(html) > 20
          no_loader = [str(page) for page in html
                       if "theme.js" not in page.read_text(encoding="utf-8")]
          assert not no_loader, f"Pages without the global navigation loader: {no_loader[:15]}"
          print(f"Navigation audit: {len(targets)} destinations and {len(html)} HTML pages")
          PY
      - name: Upload static Pages content
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
