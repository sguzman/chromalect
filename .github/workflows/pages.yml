name: Publish Chromalect
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "ontology/**"
      - "ONTOLOGY.md"
      - "tools/glyph-pipeline/**"
      - "data/catalog/colored-strokes-v0.1.json"
      - "palettes/mandarin-component-identity-v0.4.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      # One-time prerequisite: Settings > Pages > Build and deployment > Source: GitHub Actions.
      # Do not set enablement: true here: the default GITHUB_TOKEN cannot create a Pages site.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Rust dependencies
        run: cargo generate-lockfile --manifest-path tools/glyph-pipeline/Cargo.toml
      - name: Validate component-colored glyph data
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- check
      - name: Download pinned stroke geometry and ownership data
        shell: bash
        run: |
          set -euo pipefail
          REV=bddc96d41bef78427ed0e034e9f7e31d71fd1b92
          curl --fail --show-error --silent --location --retry 3 \
            "https://raw.githubusercontent.com/skishore/makemeahanzi/$REV/dictionary.txt" \
            --output "$RUNNER_TEMP/chromalect-dictionary.txt"
          curl --fail --show-error --silent --location --retry 3 \
            "https://raw.githubusercontent.com/skishore/makemeahanzi/$REV/graphics.txt" \
            --output "$RUNNER_TEMP/chromalect-graphics.txt"
      - name: Generate source-backed glyphs and extend atlas
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- discover "$RUNNER_TEMP/chromalect-dictionary.txt" "$RUNNER_TEMP/chromalect-graphics.txt"
      - name: Include machine-readable component palette
        run: |
          mkdir -p site/palettes
          cp palettes/mandarin-component-identity-v0.4.json site/palettes/
      - name: Publish ontology vocabulary, schemas and specimens
        run: |
          mkdir -p site/ontology
          cp ontology/*.json site/ontology/
          test -s site/ontology/ontology-v1.json
          test -s site/ontology/specimens-v1.json
          test -s site/ontology/vocabulary.schema.json
          test -s site/ontology/instances.schema.json
      - name: Check neutral unknown-component comparisons
        run: test -s site/glyphs/unknown-components/index.html && test -s site/glyphs/unknown-components/records.json
      - name: Check source alternative comparisons
        run: test -s site/glyphs/alternatives/index.html && test -s site/glyphs/alternatives/records.json
      - name: Check ontology-backed Mandarin search profile
        run: test -s site/profiles/mandarin-1000-v1.json && test -s site/search.html && test -s site/search.js
      - name: Check published machine-readable mappings
        run: test -s site/glyphs/mappings.json
      - name: Check generated geometry review
        run: test -s site/glyphs/review/index.html && test -s site/glyphs/review/report.json && test -s site/glyphs/review/flagged.html
      - name: Check generated diagnostic coverage
        run: test -s site/glyphs/diagnostics.json && test -s site/glyphs/diagnostics.html
      - name: Check appearance controls across generated pages
        shell: bash
        run: |
          set -euo pipefail
          test -s site/theme.js
          while IFS= read -r -d '' file; do
            grep -Fq 'theme.js' "$file" || { echo "Missing appearance controls: $file"; exit 1; }
          done < <(find site/glyphs -type f -name '*.html' -print0)
      - name: Upload static Pages content
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
