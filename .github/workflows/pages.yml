name: Publish Chromalect
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      # One-time prerequisite: Settings > Pages > Build and deployment > Source: GitHub Actions.
      # Do not set enablement: true here: the default GITHUB_TOKEN cannot create a Pages site.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static Pages content
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
