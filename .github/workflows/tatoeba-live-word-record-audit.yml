name: Check live Mandarin sentence sources
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tatoeba-live-word-record-audit.yml"
      - "tools/glyph-pipeline/tatoeba_live_word_record_audit.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check live Tatoeba v1 sentence metadata
        shell: bash
        run: |
          set -euo pipefail
          node tools/glyph-pipeline/tatoeba_live_word_record_audit_smoke.mjs
          node tools/glyph-pipeline/tatoeba_live_word_record_audit.mjs --output "$RUNNER_TEMP/tatoeba-live-word-audit.json"
      - name: Preserve research metadata without sentence text
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromalect-tatoeba-live-word-audit
          path: ${{ runner.temp }}/tatoeba-live-word-audit.json
          if-no-files-found: warn
          retention-days: 30
