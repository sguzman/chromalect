name: Glyph integrity

on:
  push:
    branches: [main]
    paths:
      - "tools/glyph-pipeline/**"
      - "data/catalog/colored-strokes-v0.1.json"
      - "palettes/mandarin-component-identity-v0.4.json"
      - "site/strokes.html"
      - "site/layers-v0.1.json"
      - "site/search.html"
      - "site/search.js"
      - "site/colors.html"
      - "site/index.html"
      - "site/style.css"
      - "site/theme.js"
      - "site/ontology.html"
      - "ontology/**"
      - "ONTOLOGY.md"
      - "site/characters/**"
      - "site/pronunciation-citations-0001-1000.json"
      - "docs/color-registry.md"
      - ".github/workflows/glyph-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check site JavaScript syntax
        run: node --check site/theme.js && node --check site/search.js && node --check site/layers.js
      - name: Resolve Rust dependencies
        run: cargo generate-lockfile --manifest-path tools/glyph-pipeline/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path tools/glyph-pipeline/Cargo.toml --locked
      - name: Validate palette, stroke ownership and published gallery
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- check
      - name: Download pinned geometry sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chromalect-hanzi-writer"
          cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- sources |
            while IFS=$'\t' read -r name url; do
              curl --fail --show-error --silent --location --retry 3 \
                "$url" --output "$RUNNER_TEMP/chromalect-hanzi-writer/$name"
            done
      - name: Verify exact upstream path arrays
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- verify-source "$RUNNER_TEMP/chromalect-hanzi-writer"
      - name: Download pinned component ownership sources
        shell: bash
        run: |
          set -euo pipefail
          REV=bddc96d41bef78427ed0e034e9f7e31d71fd1b92
          curl --fail --show-error --silent --location --retry 3 \
            "https://raw.githubusercontent.com/skishore/makemeahanzi/$REV/dictionary.txt" \
            --output "$RUNNER_TEMP/chromalect-dictionary.txt"
          curl --fail --show-error --silent --location --retry 3 \
            "https://raw.githubusercontent.com/skishore/makemeahanzi/$REV/graphics.txt" \
            --output "$RUNNER_TEMP/chromalect-graphics.txt"
      - name: Dry-run source-backed expansion
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- \
            discover "$RUNNER_TEMP/chromalect-dictionary.txt" "$RUNNER_TEMP/chromalect-graphics.txt"
          test -s site/glyphs/index.html
          test -s site/glyphs/diagnostics.json
          test -s site/glyphs/hierarchical-derivations.json
          test -s site/glyphs/hierarchical.html
          test -s site/glyphs/mappings.json
          test -s site/profiles/mandarin-1000-v1.json
          test -s site/glyphs/alternatives/index.html
          test -s site/glyphs/alternatives/records.json
          test -s site/glyphs/unknown-components/index.html
          test -s site/glyphs/unknown-components/records.json
          test -s site/glyphs/diagnostics.html
          test -s site/glyphs/review/index.html
          test -s site/glyphs/review/report.json
          test -s site/glyphs/review/flagged.html
          test "$(find site/glyphs -name '*.svg' | wc -l)" -gt 12
          while IFS= read -r -d '' file; do
            grep -Fq 'theme.js' "$file" || { echo "Missing appearance controls: $file"; exit 1; }
          done < <(find site/glyphs -type f -name '*.html' -print0)
      - name: Upload discovery report and sample assets
        uses: actions/upload-artifact@v4
        with:
          name: chromalect-stroke-discovery
          path: site/glyphs/
          retention-days: 7
