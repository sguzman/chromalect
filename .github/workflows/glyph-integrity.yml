name: Glyph integrity

on:
  push:
    branches: [main]
    paths:
      - "tools/glyph-pipeline/**"
      - "data/catalog/colored-strokes-v0.1.json"
      - "palettes/mandarin-component-identity-v0.4.json"
      - "site/strokes.html"
      - ".github/workflows/glyph-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Rust dependencies
        run: cargo generate-lockfile --manifest-path tools/glyph-pipeline/Cargo.toml
      - name: Rust tests
        run: cargo test --manifest-path tools/glyph-pipeline/Cargo.toml --locked
      - name: Validate palette, stroke ownership and published gallery
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- check
      - name: Download pinned geometry sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chromalect-hanzi-writer"
          cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- sources |
            while IFS=$'\t' read -r name url; do
              curl --fail --show-error --silent --location --retry 3 \
                "$url" --output "$RUNNER_TEMP/chromalect-hanzi-writer/$name"
            done
      - name: Verify exact upstream path arrays
        run: cargo run --quiet --locked --manifest-path tools/glyph-pipeline/Cargo.toml -- verify-source "$RUNNER_TEMP/chromalect-hanzi-writer"
